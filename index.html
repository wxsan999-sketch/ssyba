<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- ทำให้หน้าเว็บพอดีกับจอมือถือ (สไลด์ Week 4: Setting The Viewport) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSyba - รวมเกมเล่นบนเว็บ</title>

  <!-- ฟอนต์จาก Google Fonts: "Prompt" ใช้กับภาษาไทย, "Lilita One" ใช้กับชื่อเกมบนปก -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- External CSS: การตกแต่งทั้งหมดอยู่ในไฟล์ css/style.css -->
  <link rel="stylesheet" href="css/style.css">

  <!-- External JavaScript (ลำดับสำคัญ! ไฟล์หลังใช้ของจากไฟล์ก่อนหน้า)
       1) supabase.js        = ตัวช่วยคุยกับฐานข้อมูล Supabase (โหลดจาก CDN)
       2) supabase-config.js = ที่อยู่และ key ของฐานข้อมูลเรา
       3) games-data.js      = ข้อมูลเกม (ตัวแปร GAMES)
       4) account.js         = ระบบบัญชีผู้ใช้ / Library / ดาว
       5) common.js          = ฟังก์ชันใช้ร่วมกันทุกหน้า
       6) cards.js           = สร้างการ์ดเกม
       7) main.js            = โค้ดของหน้านี้ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/games-data.js"></script>
  <script src="js/account.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/main.js"></script>
</head>
<body>

  <!-- ================= ส่วนหัวเว็บ (Header) ================= -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">SSyba</a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link active">เกมทั้งหมด</a>
        <a href="library.html" class="nav-link">Library</a>
      </nav>

      <!-- ปุ่มมุมขวาบน: ถ้าล็อกอินอยู่ js/common.js จะเปลี่ยนเป็นชื่อผู้ใช้ + ปุ่ม "ออกจากระบบ" -->
      <div id="header-buttons" class="header-buttons">
        <a href="login.html" class="btn btn-outline">เข้าสู่ระบบ</a>
        <a href="register.html" class="btn btn-primary">สมัครสมาชิก</a>
      </div>
    </div>
  </header>

  <!-- ================= เนื้อหาหลัก (Content) ================= -->
  <main class="page">

    <!-- กล่องว่างสำหรับใส่การ์ดเกม
         ตอนแรกยังไม่มีอะไรข้างใน → js/main.js จะสร้างการ์ดเกมมาใส่ให้ตอนเปิดหน้าเว็บ -->
    <section id="game-grid" class="game-grid"></section>

    <!-- ข้อความนี้จะขึ้นเฉพาะตอนที่เบราว์เซอร์ปิด JavaScript ไว้ -->
    <noscript>
      <p class="no-js">กรุณาเปิด JavaScript เพื่อดูรายการเกม</p>
    </noscript>

  </main>

  <!-- ================= ส่วนท้ายเว็บ (Footer) ================= -->
  <footer class="site-footer">
    <p>© 2026 SSyba ·โปรเจควิชา Web Programming</p>
  </footer>

</body>
</html>
