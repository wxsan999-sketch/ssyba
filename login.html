<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - SSyba</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- 1) account.js = ระบบบัญชีผู้ใช้   2) common.js = ฟังก์ชันใช้ร่วมกัน   3) login.js = โค้ดของหน้านี้ -->
  <script src="js/account.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</head>
<body>

  <!-- ================= ส่วนหัวเว็บ (Header) ================= -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">SSyba</a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">เกมทั้งหมด</a>
        <a href="library.html" class="nav-link">Library</a>
      </nav>

      <div id="header-buttons" class="header-buttons">
        <a href="login.html" class="btn btn-outline">เข้าสู่ระบบ</a>
        <a href="register.html" class="btn btn-primary">สมัครสมาชิก</a>
      </div>
    </div>
  </header>

  <!-- ================= ฟอร์มเข้าสู่ระบบ ================= -->
  <main class="page">
    <section class="auth-box">
      <h1 class="auth-title">เข้าสู่ระบบ</h1>

      <!-- ข้อความอธิบาย: login.js จะใส่ให้ ถ้าถูกพามาจากปุ่มที่ต้องล็อกอินก่อน -->
      <p id="form-note" class="form-note"></p>

      <form id="login-form" class="auth-form">
        <label for="email">อีเมล</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <!-- ข้อความแจ้งข้อผิดพลาด เช่น รหัสผ่านไม่ถูกต้อง (login.js เป็นคนใส่) -->
        <p id="form-error" class="form-error" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-wide">เข้าสู่ระบบ</button>
      </form>

      <p class="auth-switch">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
    </section>
  </main>

  <!-- ================= ส่วนท้ายเว็บ (Footer) ================= -->
  <footer class="site-footer">
    <p>© 2026 SSyba · โปรเจควิชา Web Programming</p>
  </footer>

</body>
</html>
